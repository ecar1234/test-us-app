name: test_us_app
description: "TestUs"
publish_to: 'none' # Remove this line if you wish to publish to pub.dev
version: 1.0.0+1

environment:
  sdk: ^3.6.1

dependencies:
  flutter:
    sdk: flutter

  cupertino_icons: ^1.0.8
  flutter_bloc: ^9.1.1
  provider: ^6.1.5
  get_it: ^8.0.3
  get: ^4.7.2
  json_annotation: ^4.9.0
  intl: any
  gap: ^3.0.1
  uuid: ^4.5.1
  logger: ^2.6.1
  dio: ^5.8.0+1
  hive: ^2.2.3
  flex_color_scheme: ^8.2.0
  google_fonts: ^6.2.1
  shared_preferences: ^2.5.3

dev_dependencies:
  flutter_test:
    sdk: flutter

  flutter_lints: ^5.0.0
  json_serializable: ^6.9.5
  build_runner: ^2.5.4

flutter:

  uses-material-design: true

