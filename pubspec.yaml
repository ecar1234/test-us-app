name: test_us_app
description: "TestUs"
publish_to: 'none' # Remove this line if you wish to publish to pub.dev
version: 1.0.0+1

environment:
  sdk: ^3.6.1

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter
  cupertino_icons: ^1.0.8
  flutter_bloc: ^9.1.1
  provider: ^6.1.5
  get_it: ^8.0.3
  get: ^4.7.2
  json_annotation: ^4.9.0
  intl: any
  gap: ^3.0.1
  uuid: ^4.5.1
  logger: ^2.6.1
  dio: ^5.8.0+1
  hive: ^2.2.3
  flex_color_scheme: ^8.4.0
  google_fonts: ^6.2.1
  shared_preferences: ^2.5.3
  material_symbol_icons: ^0.0.1
  material_symbols_icons: ^4.2867.0
  image_picker: ^1.2.0
  path: ^1.9.1
  mime: ^2.0.0
  http_parser: ^4.1.2
  carousel_slider: ^5.1.1
  flutter_linkify: ^6.0.0
  url_launcher: ^6.3.2
  cached_network_image: ^3.4.1
  google_sign_in: ^7.2.0
  flutter_svg: ^2.2.2
  flutter_naver_login: ^2.1.1
  firebase_messaging: ^16.0.4
  firebase_core: ^4.2.1
  flutter_native_splash: ^2.4.6
  flutter_launcher_icons: ^0.14.4
  flutter_rating_bar: ^4.0.1
  shimmer: ^3.0.0
  flutter_local_notifications: ^19.5.0
  path_provider: ^2.1.5
  custom_refresh_indicator: ^4.0.1
  socket_io_client: ^3.1.4
  flutter_slidable: ^4.0.3
  accordion: ^2.6.0
  in_app_purchase: ^3.2.4
  bot_toast: ^4.1.3
  permission_handler: ^12.0.3

dev_dependencies:
  flutter_test:
    sdk: flutter

  flutter_lints: ^5.0.0
  json_serializable: ^6.9.5
  build_runner: ^2.5.4

flutter:

  uses-material-design: true

  # To add assets to your application, add an assets section, like this:
  assets:
   - assets/images/
   - assets/icons/

  # An image asset can refer to one or more resolution-specific "variants", see
  # https://flutter.dev/to/resolution-aware-images

  # For details regarding adding assets from package dependencies, see
  # https://flutter.dev/to/asset-from-package

  # To add custom fonts to your application, add a fonts section here,
  # in this "flutter" section. Each entry in this list should have a
  # "family" key with the font family name, and a "fonts" key with a
  # list giving the asset and other descriptors for the font. For
  # example:
  # fonts:
  #   - family: Schyler
  #     fonts:
  #       - asset: fonts/Schyler-Regular.ttf
  #       - asset: fonts/Schyler-Italic.ttf
  #         style: italic
  #   - family: Trajan Pro
  #     fonts:
  #       - asset: fonts/TrajanPro.ttf
  #       - asset: fonts/TrajanPro_Bold.ttf
  #         weight: 700
  #
  # For details regarding fonts from package dependencies,
  # see https://flutter.dev/to/font-from-package

flutter_launcher_icons:
  android: "launcher_icon"
  ios: true
  image_path: "assets/icons/app_icon.png"
  adaptive_icon_foreground: "assets/icons/app_icon.png"
  adaptive_icon_background: "#FFFFFF"
  remove_alpha_ios: true
  min_sdk_android: 36


flutter_native_splash:
  android: true
  ios: true
  #    color: "#FFFFFF"
  image: "assets/images/splash_image.png"
  background_image: "assets/images/splash_background.png"
  android_12:
    color: "#FFFFFF"
    image: "assets/images/splash_icon.png"
  #      background_image: "assets/images/splash_background.png"
  #      icon_background_color: "#FFFFFF"
  web: false